[project]
name = "aifeeder"
version = "0.1.0"
description = "Mindful content feed — personal AI-powered RSS reader"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
aifeeder = "aifeeder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
